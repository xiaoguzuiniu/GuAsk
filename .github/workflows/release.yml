# 推送 v* 标签（如 v0.2.0）时自动编译 Windows 安装包并发布到 GitHub Releases，
# 同时生成自动更新所需的 latest.json 和签名。
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npx -y @tauri-apps/cli@2
          tagName: ${{ github.ref_name }}
          releaseName: GuAsk ${{ github.ref_name }}
          releaseBody: 下载 GuAsk_*_x64-setup.exe 安装；已安装的版本会自动提示更新。
          releaseDraft: false
          includeUpdaterJson: true