<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 13.5px/1.6 "Segoe UI", "Microsoft YaHei UI", sans-serif; color: #1f2328; background: #f5f6f8; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
.page { padding: 18px 18px 80px; max-width: 640px; margin: 0 auto; }
.head { display: flex; align-items: center; gap: 10px; margin: 2px 2px 16px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: #2563eb; color: #fff; display: grid; place-items: center; font-weight: 700; }
.head h1 { margin: 0; font-size: 17px; }
.head p { margin: 0; color: #71717a; font-size: 12px; }
.card { background: #fff; border: 1px solid #ebebee; border-radius: 12px; padding: 14px 16px 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 10px; font-size: 13px; color: #52525b; font-weight: 600; letter-spacing: .3px; }
.field { margin-top: 10px; }
.field > span { display: block; font-size: 12.5px; color: #3f3f46; margin-bottom: 4px; font-weight: 500; }
.field small { color: #a1a1aa; font-weight: 400; margin-left: 6px; }
input, select, textarea { width: 100%; padding: 7px 10px; border: 1px solid #e4e4e7; border-radius: 8px; font: inherit; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px #dbeafe; }
textarea { min-height: 76px; resize: vertical; }
.row { display: flex; gap: 8px; }
.row > :first-child { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { border: 1px solid #e4e4e7; background: #fff; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; white-space: nowrap; color: #3f3f46; }
button:hover { background: #f4f4f5; }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: #2563eb; border-color: #2563eb; color: #fff; padding: 7px 22px; }
button.primary:hover { background: #1d4ed8; }
.eye { padding: 6px 10px; }
.switch { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.switch input { display: none; }
.switch i { width: 36px; height: 20px; border-radius: 10px; background: #d4d4d8; position: relative; cursor: pointer; transition: .2s; flex-shrink: 0; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
.switch input:checked + i { background: #2563eb; }
.switch input:checked + i::after { left: 18px; }
.status { margin-top: 10px; font-size: 12.5px; padding: 7px 10px; border-radius: 8px; display: none; word-break: break-all; }
.status.ok { display: block; background: #f0fdf4; color: #15803d; }
.status.err { display: block; background: #fef2f2; color: #b91c1c; }
.status.info { display: block; background: #f4f4f5; color: #52525b; }
.footer { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(6px); border-top: 1px solid #ebebee; padding: 10px 18px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
.toast { position: fixed; left: 50%; top: 16px; transform: translate(-50%, -12px); opacity: 0; pointer-events: none; transition: .25s; background: #fff; border: 1px solid #ebebee; box-shadow: 0 6px 24px rgba(0,0,0,.12); border-radius: 10px; padding: 8px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px; z-index: 9; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast::before { content: "✓"; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: #fff; background: #16a34a; }
.toast.err::before { content: "!"; background: #dc2626; }
button.primary.done { background: #16a34a; border-color: #16a34a; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; padding: 5px; border: 1px dashed #e4e4e7; border-radius: 8px; }
.chips:empty::before { content: "尚未选择，提问时将使用翻译模型"; color: #a1a1aa; font-size: 12px; padding: 2px 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: #eff6ff; color: #1d4ed8; border-radius: 6px; padding: 1px 4px 1px 8px; font-size: 12.5px; }
.chip b { cursor: pointer; font-weight: 400; color: #60a5fa; padding: 0 4px; border-radius: 4px; }
.chip b:hover { background: #dbeafe; color: #1d4ed8; }
.picker { margin-top: 8px; max-height: 180px; overflow: auto; border: 1px solid #e4e4e7; border-radius: 8px; display: none; }
.picker label { display: flex; align-items: center; gap: 8px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.picker label:hover { background: #f4f4f5; }
.picker input { width: auto; }
.tpl { border: 1px solid #ebebee; border-radius: 10px; padding: 8px; margin-top: 8px; }
.tpl textarea { margin-top: 6px; height: 64px; }
.tpl .del { color: #dc2626; }
.tabs { position: sticky; top: 0; z-index: 4; display: flex; gap: 4px; justify-content: center; padding: 10px 0 6px; background: #f5f6f8; }
.tabs button { padding: 5px 18px; border-radius: 999px; font-size: 13px; color: #52525b; background: transparent; border: none; cursor: pointer; }
.tabs button.on { background: #fff; color: #2563eb; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.hpanel { background: #fff; border: 1px solid #ebebee; border-radius: 14px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.hsearch { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 38px; border-radius: 10px; background: #f4f4f5; color: #a1a1aa; transition: .15s; border: 1px solid transparent; }
.hsearch:focus-within { background: #fff; border-color: #93c5fd; box-shadow: 0 0 0 3px #eff6ff; color: #2563eb; }
.hsearch input { flex: 1; border: none !important; outline: none; background: transparent; padding: 0 !important; font: inherit; color: #1f2328; box-shadow: none !important; }
.hfilter { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.hfilter button { border: 1px solid #ebebee; background: #fff; color: #52525b; border-radius: 999px; padding: 3px 14px; font-size: 12.5px; cursor: pointer; transition: .15s; }
.hfilter button:hover { border-color: #bfdbfe; color: #2563eb; }
.hfilter button.on { background: #2563eb; border-color: #2563eb; color: #fff; }
.hmeta { display: flex; justify-content: space-between; align-items: center; margin: 12px 4px 8px; color: #a1a1aa; font-size: 12px; }
.hclear { border: none; background: transparent; color: #a1a1aa; font-size: 12px; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.hclear:hover { background: #fef2f2; color: #dc2626; }
.hclear[data-sure="1"] { background: #dc2626; color: #fff; }
.hmeta > span:last-child { display: flex; align-items: center; gap: 10px; }
.switch.mini { margin: 0; gap: 6px; font-weight: 400; color: #52525b; }
.switch.mini i { width: 30px; height: 17px; } .switch.mini i::after { width: 13px; height: 13px; }
.switch.mini input:checked + i::after { left: 15px; }
.danger { color: #dc2626 !important; }
.hitem { background: #fff; border: 1px solid #ebebee; border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.hhead { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; cursor: pointer; }
.hhead:hover { background: #fafafa; }
.tag { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 6px; background: #eff6ff; color: #1d4ed8; margin-top: 2px; }
.tag.t-代码 { background: #f5f3ff; color: #6d28d9; } .tag.t-单词 { background: #ecfdf5; color: #047857; } .tag.t-提问 { background: #fff7ed; color: #c2410c; }
.hsrc { flex: 1; min-width: 0; }
.hsrc .s { color: #18181b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hsrc .a { color: #71717a; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.htime { flex: none; color: #a1a1aa; font-size: 11.5px; margin-top: 2px; }
.hbody { display: none; border-top: 1px solid #f0f0f2; padding: 6px 14px 10px; }
.hitem.open .hbody { display: block; }
.hitem.open .hsrc .s, .hitem.open .hsrc .a { white-space: normal; }
.hmsg { margin: 8px 0; }
.hmsg.u { background: #eff6ff; color: #1e3a8a; border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; word-break: break-word; }
.hops { display: flex; gap: 6px; justify-content: flex-end; }
.hops button { font-size: 12px; padding: 2px 8px; }
.hops .hopen { color: #2563eb; font-weight: 600; }
.hhead { position: relative; }
.hgo { flex: none; border: none; background: #eff6ff; color: #2563eb; border-radius: 6px; font-size: 12px; padding: 2px 9px; cursor: pointer; opacity: 0; transition: opacity .15s; margin-top: 1px; }
.hhead:hover .hgo { opacity: 1; }
.hhead:hover .htime { display: none; }
.more { display: block; margin: 8px auto; }
mark { background: #fef08a; color: inherit; border-radius: 2px; }
.empty { text-align: center; padding: 56px 0 40px; }
.empty img { width: 64px; height: 64px; opacity: .9; animation: bob 2.4s ease-in-out infinite; }
.empty .eico { font-size: 36px; opacity: .6; }
.empty .et { margin-top: 12px; font-size: 14.5px; font-weight: 600; color: #52525b; }
.empty .es { margin-top: 4px; font-size: 12.5px; color: #a1a1aa; }
@keyframes bob { 50% { transform: translateY(-4px); } }
/* 回答内 markdown */
.md p { margin: 4px 0 8px; } .md ul, .md ol { margin: 4px 0 8px; padding-left: 20px; }
.md code { background: #f4f4f5; padding: 1px 5px; border-radius: 4px; font: 12.5px Consolas, monospace; }
.md .cb { border: 1px solid #ebebee; border-radius: 8px; margin: 6px 0 10px; overflow: hidden; }
.md .cb-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 2px 10px; background: #f6f8fa; border-bottom: 1px solid #ebebee; font-size: 11.5px; color: #8b949e; }
.md .cb-h .cpy { font-size: 11.5px; padding: 1px 8px; }
.md .cb pre { margin: 0; padding: 8px 10px; overflow: auto; background: #fbfbfc; }
.md pre code { background: none; padding: 0; color: #24292f; }
.md .sub { color: #64748b; }
.hl-k { color: #cf222e; } .hl-s { color: #0a3069; } .hl-n { color: #0550ae; } .hl-c { color: #6e7781; font-style: italic; } .hl-f { color: #8250df; } .hl-t { color: #953800; }
.hint { color: #a1a1aa; font-size: 12px; margin-top: 4px; }
.about { display: flex; align-items: center; gap: 12px; font-size: 13.5px; }
.about b { font-weight: 600; }
.upst { flex: 1; color: #71717a; font-size: 12.5px; }
.upst.new { color: #2563eb; font-weight: 500; }
</style>
</head>
<body>
<div class="tabs"><button id="tabSet" class="on">设置</button><button id="tabHis">历史记录</button></div>
<div class="page" id="pageHis" style="display:none">
  <div class="hpanel">
    <div class="hsearch">
      <svg width="15" height="15" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="hq" placeholder="搜索原文或回答…">
    </div>
    <div class="hfilter" id="hfilter">
      <button data-m="" class="on">全部</button><button data-m="翻译">翻译</button><button data-m="单词">单词</button><button data-m="提问">提问</button><button data-m="代码">代码</button>
    </div>
    <select id="hmode" style="display:none"><option value=""></option></select>
  </div>
  <div class="hmeta"><span id="hcount"></span><span><label class="switch mini"><span>记录历史</span><input type="checkbox" id="history_enabled"><i></i></label><button id="hclear" type="button" class="hclear">清空</button></span></div>
  <div id="hlist"></div>
  <button id="hmore" type="button" class="more" style="display:none">加载更多</button>
</div>
<div class="page" id="pageSet">

  <div class="card">
    <h2>模型服务</h2>
    <label class="field"><span>API Base URL</span>
      <input id="base_url" placeholder="https://api.deepseek.com/v1"></label>
    <label class="field"><span>API Key</span>
      <div class="row"><input id="api_key" type="password" placeholder="sk-..."><button class="eye" id="eye" type="button">显示</button></div></label>
    <div class="field"><span>翻译模型<small>划词翻译固定使用这个模型</small></span>
      <div class="row">
        <select id="modelSel"></select><input id="model" placeholder="deepseek-chat" style="display:none">
        <button id="fetch" type="button">获取模型</button>
        <button id="test" type="button">测试连通性</button>
      </div></div>
    <datalist id="models"></datalist>
    <div class="status" id="status"></div>

    <div class="field"><span>提问可选模型<small>弹窗里提问时可在这些模型间切换</small></span>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:8px">
        <input id="filter" placeholder="先点“获取模型”，再在这里搜索并勾选">
        <button id="addManual" type="button">手动添加</button>
      </div>
      <div class="picker" id="picker"></div>
    </div>
  </div>

  <div class="card">
    <h2>翻译与提问</h2>
    <label class="field"><span>唤出方式<small>划词后按下触发键才弹出，避免和复制冲突</small></span>
      <select id="trigger">
        <option value="ctrl2">双击 Ctrl（推荐）</option>
        <option value="alt2">双击 Alt</option>
        <option value="shift2">双击 Shift</option>
        <option value="icon">划词后显示小图标，点击弹出</option>
        <option value="auto">划词后立即弹出</option>
      </select></label>
    <label class="field"><span>快捷提问<small>不划词也能直接打开提问，如 Alt+Q、Ctrl+Shift+Space，留空禁用</small></span>
      <input id="hotkey" placeholder="Alt+Q"></label>
    <label class="field"><span>截图提问<small>框选屏幕区域后拿截图提问（需模型支持图片），留空禁用</small></span>
      <input id="shot_hotkey" placeholder="Alt+W"></label>
    <label class="field"><span>目标语言</span><input id="target_lang" placeholder="简体中文"></label>
    <label class="switch"><span>划词后自动翻译 / 提问（英文自动翻译，中文进入提问）</span><input type="checkbox" id="auto_translate"><i></i></label>
    <label class="field"><span>翻译提示词<small>{lang} 会替换为目标语言</small></span><textarea id="translate_prompt"></textarea></label>
    <label class="field"><span>提问提示词</span><textarea id="ask_prompt"></textarea></label>
    <label class="field"><span>单词卡片提示词<small>选中单个英文单词时使用</small></span><textarea id="word_prompt" style="height:110px"></textarea></label>
  </div>

  <div class="card">
    <h2>程序员模式</h2>
    <label class="switch"><span>自动识别代码 / 报错 / 日志，切换到「代码」解释模式</span><input type="checkbox" id="code_detect"><i></i></label>
    <label class="field"><span>代码解释提示词</span><textarea id="code_prompt" style="height:110px"></textarea></label>
  </div>

  <div class="card">
    <h2>关于</h2>
    <div class="about"><span>GuAsk <b id="ver"></b></span><span id="upst" class="upst"></span><button id="upbtn">检查更新</button></div>
  </div>

</div>

<div class="footer"><button class="primary" id="save">保存</button></div><div class="toast" id="toast"></div>

<script src="md.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const keys = ["base_url", "api_key", "model", "trigger", "hotkey", "shot_hotkey", "target_lang", "translate_prompt", "ask_prompt", "word_prompt", "code_prompt"];
const $ = (id) => document.getElementById(id);
const escA = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let cfg = {};
let askModels = [];
let allModels = [];

const form = () => {
  const c = { ...cfg, auto_translate: $("auto_translate").checked, code_detect: $("code_detect").checked, history_enabled: $("history_enabled").checked, ask_models: askModels, translate_model: "", };
  keys.forEach((k) => (c[k] = $(k).value.trim()));
  return c;
};
const status = (cls, msg) => { $("status").className = "status " + cls; $("status").textContent = msg; };

function renderChips() {
  $("chips").innerHTML = askModels.map((m, i) => `<span class="chip">${escA(m)}<b data-i="${i}" title="移除">×</b></span>`).join("");
}
function renderPicker() {
  const q = $("filter").value.trim().toLowerCase();
  const list = allModels.filter((m) => m.toLowerCase().includes(q));
  $("picker").style.display = allModels.length ? "block" : "none";
  $("picker").innerHTML = list.map((m) => `<label><input type="checkbox" value="${escA(m)}" ${askModels.includes(m) ? "checked" : ""}>${escA(m)}</label>`).join("")
    || `<div class="hint" style="padding:6px 10px">没有匹配的模型</div>`;
}
$("chips").onclick = (e) => { const i = e.target.dataset.i; if (i !== undefined) { askModels.splice(+i, 1); renderChips(); renderPicker(); } };
$("picker").onchange = (e) => {
  const m = e.target.value;
  askModels = e.target.checked ? [...askModels, m] : askModels.filter((x) => x !== m);
  renderChips();
};
$("filter").oninput = renderPicker;
$("addManual").onclick = () => {
  const m = $("filter").value.trim();
  if (m && !askModels.includes(m)) { askModels.push(m); renderChips(); renderPicker(); }
  $("filter").value = ""; renderPicker();
};

invoke("get_config").then((c) => {
  cfg = c;
  keys.forEach((k) => ($(k).value = c[k] ?? ""));
  if (!$("trigger").value) $("trigger").value = "ctrl2";
  if (c.translate_model) $("model").value = c.translate_model;
  fillModelSel();
  if (c.api_key) loadModels(true);
  $("auto_translate").checked = c.auto_translate;
  $("code_detect").checked = c.code_detect;
  $("history_enabled").checked = c.history_enabled;
  askModels = c.ask_models || [];
  renderChips();
});

$("eye").onclick = () => { const p = $("api_key").type === "password"; $("api_key").type = p ? "text" : "password"; $("eye").textContent = p ? "隐藏" : "显示"; };

function fillModelSel() {
  const cur = $("model").value;
  const list = allModels.includes(cur) || !cur ? allModels : [cur, ...allModels];
  const sel = $("modelSel");
  sel.innerHTML = list.length ? "" : `<option value="${escA(cur)}">${escA(cur || "请先点击“获取模型”")}</option>`;
  list.forEach((m) => sel.add(new Option(m, m)));
  sel.add(new Option("✎ 手动输入…", "__custom__"));
  sel.value = cur;
}
$("modelSel").onchange = (e) => {
  if (e.target.value === "__custom__") {
    $("modelSel").style.display = "none"; $("model").style.display = ""; $("model").focus();
  } else $("model").value = e.target.value;
};
$("model").onblur = () => { $("model").style.display = "none"; $("modelSel").style.display = ""; fillModelSel(); };
$("model").onkeydown = (e) => { if (e.key === "Enter") $("model").blur(); };

async function loadModels(silent) {
  try {
    allModels = await invoke("list_models", { cfg: form() });
    fillModelSel(); renderPicker();
    if (!silent) status(allModels.length ? "ok" : "err", allModels.length ? `获取到 ${allModels.length} 个模型` : "接口没有返回任何模型");
  } catch (e) { if (!silent) status("err", "获取失败：" + e); }
}

$("fetch").onclick = async () => {
  const b = $("fetch"); b.disabled = true; status("info", "正在获取模型列表…");
  try {
    allModels = await invoke("list_models", { cfg: form() });
    fillModelSel();
    renderPicker();
    status(allModels.length ? "ok" : "err", allModels.length ? `获取到 ${allModels.length} 个模型：翻译模型可在下拉框选择，提问模型请在下方勾选` : "接口没有返回任何模型");
  } catch (e) { status("err", "获取失败：" + e); }
  b.disabled = false;
};

$("test").onclick = async () => {
  const c = form();
  if (!c.model) return status("err", "请先填写翻译模型");
  const b = $("test"); b.disabled = true; status("info", `正在测试 ${c.model} …`);
  try {
    const [ms, reply] = await invoke("test_connection", { cfg: c });
    status("ok", `✓ 连通成功 · ${c.model} · ${ms} ms${reply ? " · 回复：" + reply : ""}`);
  } catch (e) { status("err", "✗ 测试失败：" + e); }
  b.disabled = false;
};

let toastTimer;
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast" + (err ? " err" : "")), 1800);
}
$("save").onclick = async () => {
  const b = $("save");
  try {
    const c = form(); await invoke("save_config", { cfg: c }); cfg = c;
    toast("设置已保存");
    b.textContent = "✓ 已保存"; b.classList.add("done");
    setTimeout(() => { b.textContent = "保存"; b.classList.remove("done"); }, 1500);
  } catch (e) { toast("保存失败：" + e, true); }
};
document.addEventListener("keydown", (e) => { if (e.ctrlKey && e.key === "s") { e.preventDefault(); $("save").click(); } });

// ===== 历史记录 =====
const H = { q: "", mode: "", offset: 0, items: [], total: 0 };
const PAGE = 30;
function showTab(his) {
  $("tabSet").classList.toggle("on", !his); $("tabHis").classList.toggle("on", his);
  $("pageSet").style.display = his ? "none" : ""; $("pageHis").style.display = his ? "" : "none";
  document.querySelector(".footer").style.display = his ? "none" : "";
  if (his) loadHis(true);
}
$("tabSet").onclick = () => showTab(false);
$("tabHis").onclick = () => showTab(true);
const fmtTime = (ms) => {
  const d = new Date(ms), n = new Date(), p = (x) => String(x).padStart(2, "0");
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  if (d.toDateString() === n.toDateString()) return "今天 " + hm;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "昨天 " + hm;
  return (d.getFullYear() === n.getFullYear() ? "" : d.getFullYear() + "-") + `${p(d.getMonth() + 1)}-${p(d.getDate())} ${hm}`;
};
const mark = (s) => {
  const e = escA(s);
  if (!H.q) return e;
  const k = escA(H.q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return e.replace(new RegExp(k, "gi"), (m) => `<mark>${m}</mark>`);
};
async function loadHis(reset) {
  if (reset) { H.offset = 0; H.items = []; }
  try {
    const r = await invoke("history_list", { q: H.q, mode: H.mode, offset: H.offset, limit: PAGE });
    H.items.push(...r.items); H.total = r.total; H.offset += r.items.length;
  } catch (e) { $("hlist").innerHTML = `<div class="empty">${escA(String(e))}</div>`; return; }
  $("hcount").textContent = `共 ${H.total} 条`;
  $("hmore").style.display = H.items.length < H.total ? "" : "none";
  $("hlist").innerHTML = H.items.map((it, i) => {
    let msgs = []; try { msgs = JSON.parse(it.messages); } catch {}
    const ans = (msgs.find((m) => m.role === "assistant") || {}).content || "";
    return `<div class="hitem" data-i="${i}"><div class="hhead"><span class="tag t-${escA(it.mode)}">${escA(it.mode)}</span>
      <div class="hsrc"><div class="s">${mark(it.source)}</div><div class="a">${mark(ans.replace(/[#*`>]/g, "").slice(0, 200))}</div></div>
      <span class="htime">${fmtTime(it.ts)}</span><button class="hgo hopen" type="button" title="在弹窗中打开，可继续追问">打开</button></div><div class="hbody"></div></div>`;
  }).join("") || (H.q || H.mode
    ? `<div class="empty"><div class="eico">🔍</div><div class="et">没有匹配的记录</div><div class="es">换个关键词或筛选条件试试</div></div>`
    : `<div class="empty"><img src="penguin.png" alt=""><div class="et">还没有历史记录</div><div class="es">划词翻译或提问后，会自动保存在这里</div></div>`);
}
let hqTimer;
$("hq").oninput = () => { clearTimeout(hqTimer); hqTimer = setTimeout(() => { H.q = $("hq").value.trim(); loadHis(true); }, 250); };
$("hfilter").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  $("hfilter").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  H.mode = b.dataset.m; loadHis(true);
};
$("hmore").onclick = () => loadHis(false);
$("hclear").onclick = async () => {
  const b = $("hclear");
  if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "确定清空？"; setTimeout(() => { b.dataset.sure = ""; b.textContent = "清空"; }, 3000); return; }
  await invoke("history_clear"); b.dataset.sure = ""; b.textContent = "清空"; loadHis(true);
};
$("history_enabled").onchange = async () => {
  const c = { ...cfg, history_enabled: $("history_enabled").checked };
  await invoke("save_config", { cfg: c }); cfg = c;
};
$("hlist").onclick = async (e) => {
  const item = e.target.closest(".hitem"); if (!item) return;
  const it = H.items[+item.dataset.i];
  const cpy = e.target.closest(".cpy");
  if (cpy) { await navigator.clipboard.writeText(cpy.closest(".cb").querySelector("code").innerText); cpy.textContent = "已复制"; return; }
  if (e.target.closest(".hdel")) { await invoke("history_delete", { id: it.id }); H.items.splice(+item.dataset.i, 1); H.total--; item.remove(); $("hcount").textContent = `共 ${H.total} 条`; return; }
  if (e.target.closest(".hopen") || (e.target.closest(".hhead") && e.detail === 2)) { invoke("history_open", { item: it }); return; }
  if (e.target.closest(".hcopy")) {
    let msgs = []; try { msgs = JSON.parse(it.messages); } catch {}
    const a = msgs.filter((m) => m.role === "assistant").pop();
    await navigator.clipboard.writeText(a ? a.content : ""); e.target.closest(".hcopy").textContent = "已复制"; return;
  }
  if (!e.target.closest(".hhead")) return;
  const body = item.querySelector(".hbody");
  if (!item.classList.contains("open") && !body.innerHTML) {
    let msgs = []; try { msgs = JSON.parse(it.messages); } catch {}
    body.innerHTML = msgs.map((m, k) => m.role === "user"
      ? (k === 0 ? "" : `<div class="hmsg u">${escA(m.content)}</div>`)
      : `<div class="hmsg md">${renderMd(m.content)}</div>`).join("")
      + `<div class="hops"><span style="flex:1;color:#a1a1aa;font-size:11.5px;align-self:center">${escA(it.model || "")}</span><button class="hopen" type="button">在弹窗中打开</button><button class="hcopy" type="button">复制回答</button><button class="hdel danger" type="button">删除</button></div>`;
  }
  item.classList.toggle("open");
};

// ---- 自动更新 ----
const upd = window.__TAURI__.updater, proc = window.__TAURI__.process;
window.__TAURI__.app.getVersion().then((v) => ($("ver").textContent = "v" + v));
let pending = null;
async function checkUpdate(manual) {
  const st = $("upst"), b = $("upbtn");
  if (pending) {
    b.disabled = true;
    st.textContent = "正在下载…";
    let total = 0, got = 0;
    try {
      await pending.downloadAndInstall((e) => {
        if (e.event === "Started") total = e.data.contentLength || 0;
        if (e.event === "Progress") { got += e.data.chunkLength; if (total) st.textContent = `正在下载 ${Math.round((got / total) * 100)}%`; }
        if (e.event === "Finished") st.textContent = "安装中，即将重启…";
      });
      await proc.relaunch();
    } catch (e) { st.textContent = "更新失败：" + e; b.disabled = false; }
    return;
  }
  if (manual) st.textContent = "检查中…";
  try {
    const u = await upd.check();
    if (u) { pending = u; st.textContent = `发现新版本 v${u.version}`; st.className = "upst new"; b.textContent = "立即更新"; }
    else if (manual) st.textContent = "已是最新版本 ✓";
  } catch (e) { if (manual) st.textContent = "检查失败：" + e; }
}
$("upbtn").onclick = () => checkUpdate(true);
checkUpdate(false);
</script>
