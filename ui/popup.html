<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
  <div class="bar" data-tauri-drag-region>
    <span class="title" data-tauri-drag-region>GuAsk</span>
    <div class="seg">
      <button id="mTrans" class="on">翻译</button>
      <button id="mAsk">提问</button>
      <button id="mCode" title="解释代码 / 报错 / 日志">代码</button>
    </div>
    <div class="tpick" id="tpick">
      <button id="tBtn" class="icon" type="button" title="更多模板"><span id="tName">模板</span><svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <div class="menu down" id="tMenu"></div>
    </div>
    <button id="pin" class="icon" title="固定（失焦不关闭）">📌</button>
    <button id="close" class="icon" title="关闭 (Esc)">✕</button>
  </div>
  <div class="word" id="word" style="display:none"><span class="w" id="wText"></span><button id="speak" class="spk" type="button" title="朗读 (英音/美音取决于系统语音)"><svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z" fill="currentColor"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button></div>
  <div class="src" id="src"></div>
  <div id="out"></div>
  <div class="stopWrap"><button id="stop" class="stopPill" title="停止生成 (Esc)" style="display:none"><svg width="9" height="9" viewBox="0 0 10 10"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>停止生成</button></div>
  <div class="ask" id="askBox">
    <div class="composer">
      <textarea id="q" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <div class="tools">
        <div class="mpick" id="mpick">
          <button id="mBtn" type="button"><span class="dot"></span><span id="mName"></span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 6.5L5 3.5L8 6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          <div class="menu" id="mMenu"></div>
        </div>
        <button id="send" class="sendBtn" title="发送"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
</div>
<script src="md.js"></script>
<script src="popup.js"></script>
</body>
</html>
